<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Estudos</title>
</head>
<body>
  <h1>Sistema de Estudos — ENADE</h1>
  <p>Faça login para começar a estudar.</p>

  <form id="login">
    <input type="email" id="email"
           placeholder="E-mail" required>

    <input type="password" id="senha"
           placeholder="Senha" required>

    <button type="submit">Entrar</button>
  </form>

  <p id="mensagem"></p>

  <section id="area-questao" hidden>
  <h2 id="titulo-questao"></h2>
  <p id="enunciado"></p>
  <div id="alternativas"></div>
  </section>

  <script type="module">
  import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://jecqqtscjkqurntyufti.supabase.co";
  const SUPABASE_KEY = "sb_publishable_tCNKF8LU0S8kpwdxkVkQ6g_wznH5PrM";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const formulario = document.getElementById("login");
  const mensagem = document.getElementById("mensagem");

  formulario.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("senha").value;

    mensagem.textContent = "Entrando...";

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      mensagem.textContent = "Não foi possível entrar. Verifique suas credenciais.";
      return;
    }

    formulario.hidden = true;
    mensagem.textContent = "Login realizado com sucesso!";
    const { data: questoes, error: erroQuestoes } = await supabase
  .from("questoes")
  .select("id, ano, numero_questao, enunciado, opcoes")
  .eq("ano", 2017)
  .order("numero_questao");

if (erroQuestoes) {
  mensagem.textContent = "Erro ao carregar questões.";
  console.error(erroQuestoes);
} else {
  console.log("Questões carregadas:", questoes);
  mensagem.textContent =
    `Login realizado! ${questoes.length} questão(ões) encontrada(s).`;

  if (questoes.length > 0) {
  const questao = questoes[0];

  document.getElementById("area-questao").hidden = false;

  document.getElementById("titulo-questao").textContent =
    `ENADE ${questao.ano} — Questão ${questao.numero_questao}`;

  document.getElementById("enunciado").textContent =
    questao.enunciado;

  document.getElementById("alternativas").textContent =
    JSON.stringify(questao.opcoes, null, 2);
}
}
  });
    
</script>
</body>
</html>
