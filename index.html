<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador ENADE | Engenharia de Computação</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#f8fafc; --muted:#94a3b8; --accent:#3b82f6; --success:#10b981; --error:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; background:var(--bg); color:var(--text); font-family:system-ui,'Segoe UI',sans-serif; display:grid; place-items:center; }
    .container { width:min(100%,820px); background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:clamp(20px,4vw,36px); box-shadow:0 15px 45px #0004; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(20px,3vw,27px); }
    h2 { font-size:19px; margin:0 0 16px; }
    .muted { color:var(--muted); }
    .badge { display:inline-block; color:#93c5fd; background:#3b82f622; padding:7px 12px; border-radius:30px; font-size:13px; white-space:nowrap; }
    input[type=email],input[type=password] { display:block; width:100%; padding:13px 14px; margin:12px 0; border:1px solid var(--border); border-radius:9px; background:#0f172a; color:var(--text); font:inherit; }
    button { font:inherit; cursor:pointer; }
    .primary { width:100%; margin-top:22px; padding:14px; border:0; border-radius:9px; background:var(--accent); color:white; font-weight:650; }
    .primary:hover:not(:disabled) { filter:brightness(1.1); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .secondary { padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--muted); }
    .question { white-space:pre-wrap; line-height:1.75; font-size:16px; margin-bottom:24px; }
    .options { display:grid; gap:11px; }
    .option { display:flex; align-items:flex-start; gap:12px; padding:15px; background:#0f172a88; border:1px solid var(--border); border-radius:10px; cursor:pointer; line-height:1.5; }
    .option:hover { border-color:var(--accent); }
    .option:has(input:checked) { border-color:var(--accent); background:#3b82f61c; }
    .option input { margin-top:4px; accent-color:var(--accent); }
    .feedback { margin-top:18px; padding:14px; border-radius:9px; line-height:1.5; }
    .feedback.correct { background:#10b98116; border:1px solid var(--success); color:#6ee7b7; }
    .feedback.incorrect { background:#ef444416; border:1px solid var(--error); color:#fca5a5; }
    .feedback.info { background:#3b82f616; border:1px solid var(--accent); color:#bfdbfe; }
    .top-actions { display:flex; align-items:center; gap:12px; }
    [hidden] { display:none !important; }
    @media(max-width:520px) { body { padding:12px; } .container { padding:20px; } .header { align-items:flex-start; } .top-actions { flex-direction:column; align-items:flex-end; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Simulador ENADE</h1>
        <p class="muted" style="margin:7px 0 0">Engenharia de Computação</p>
      </div>
      <div class="top-actions">
        <span class="badge" id="badge-ano">ENADE 2017</span>
        <button class="secondary" id="sair" type="button" hidden>Sair</button>
      </div>
    </header>

    <section id="area-login">
      <h2>Entrar para estudar</h2>
      <p class="muted">Use seu e-mail e senha cadastrados.</p>
      <form id="form-login">
        <input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
        <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
        <button id="btn-entrar" class="primary" type="submit">Entrar</button>
      </form>
    </section>

    <section id="area-estudo" hidden>
      <h2 id="titulo-questao">Carregando questão...</h2>
      <div class="question" id="enunciado"></div>
      <form id="form-resposta" hidden>
        <div class="options" id="alternativas"></div>
        <button class="primary" id="btn-responder" type="submit">Confirmar resposta</button>
      </form>
      <div id="feedback" class="feedback" hidden role="status" aria-live="polite"></div>
    </section>

    <p id="mensagem" class="muted" role="status" aria-live="polite"></p>
  </main>

  <script>
    // Chave PUBLICÁVEL do Supabase. Nunca use secret/service_role aqui.
    const SUPABASE_URL = 'https://jecqqtscjkqurntyufti.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tCNKF8LU0S8kpwdxkVkQ6g_wznH5PrM';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    let questaoAtual = null;
    let respostaEnviada = false;

    function mensagem(texto) { $('mensagem').textContent = texto; }
    function feedback(texto, tipo = 'info') {
      $('feedback').textContent = texto;
      $('feedback').className = `feedback ${tipo}`;
      $('feedback').hidden = false;
    }

    function mostrarLogin() {
      questaoAtual = null;
      respostaEnviada = false;
      $('area-login').hidden = false;
      $('area-estudo').hidden = true;
      $('sair').hidden = true;
      $('feedback').hidden = true;
      $('form-resposta').hidden = true;
    }

    function renderizarQuestao(q) {
      questaoAtual = q;
      respostaEnviada = false;
      $('badge-ano').textContent = `ENADE ${q.ano}`;
      $('titulo-questao').textContent = `Questão ${q.numero_questao} — ${q.materia || 'ENADE'}`;
      $('enunciado').textContent = q.enunciado;
      $('feedback').hidden = true;
      $('btn-responder').disabled = false;

      const container = $('alternativas');
      container.replaceChildren();
      const opcoes = q.opcoes && typeof q.opcoes === 'object' ? q.opcoes : {};
      for (const letra of ['A','B','C','D','E']) {
        if (typeof opcoes[letra] !== 'string') continue;
        const label = document.createElement('label');
        label.className = 'option';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'resposta';
        radio.value = letra;
        const texto = document.createElement('span');
        texto.textContent = `${letra}) ${opcoes[letra]}`;
        label.append(radio, texto);
        container.append(label);
      }
      $('form-resposta').hidden = container.children.length === 0;
      if (!container.children.length) feedback('Esta questão ainda não possui alternativas cadastradas.');
    }

    async function carregarQuestao() {
      mensagem('Carregando questão...');
      $('area-login').hidden = true;
      $('area-estudo').hidden = false;
      $('sair').hidden = false;
      $('form-resposta').hidden = true;
      $('feedback').hidden = true;

      const { data, error } = await db.from('questoes')
        .select('id, ano, numero_questao, materia, enunciado, opcoes')
        .eq('ano', 2017)
        .eq('tipo', 'OBJETIVA')
        .order('numero_questao', { ascending: true })
        .limit(1);

      if (error) {
        console.error('Erro ao carregar questões:', error);
        $('titulo-questao').textContent = 'Não foi possível carregar a questão';
        $('enunciado').textContent = '';
        mensagem('Confira a conexão e as permissões de leitura no Supabase.');
        return;
      }
      if (!data?.length) {
        $('titulo-questao').textContent = 'Nenhuma questão encontrada';
        $('enunciado').textContent = '';
        mensagem('Não há questões objetivas de 2017 cadastradas.');
        return;
      }
      renderizarQuestao(data[0]);
      mensagem('Selecione uma alternativa e confirme sua resposta.');
    }

    $('form-login').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('btn-entrar').disabled = true;
      mensagem('Entrando...');
      try {
        const { error } = await db.auth.signInWithPassword({
          email: $('email').value.trim(),
          password: $('senha').value
        });
        if (error) throw error;
        $('senha').value = '';
        await carregarQuestao();
      } catch (error) {
        console.error('Erro no login:', error);
        mensagem('Não foi possível entrar. Verifique seu e-mail e senha.');
      } finally {
        $('btn-entrar').disabled = false;
      }
    });

    $('form-resposta').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!questaoAtual || respostaEnviada) return;
      const selecionada = document.querySelector('input[name="resposta"]:checked');
      if (!selecionada) { feedback('Selecione uma alternativa antes de confirmar.'); return; }

      $('btn-responder').disabled = true;
      mensagem('Corrigindo resposta...');
      const { data, error } = await db.rpc('responder_questao', {
        p_questao_id: questaoAtual.id,
        p_resposta: selecionada.value
      });
      if (error) {
        console.error('Erro ao corrigir:', error);
        feedback('Não foi possível registrar a resposta. Tente novamente.');
        $('btn-responder').disabled = false;
        mensagem('');
        return;
      }
      const resultado = Array.isArray(data) ? data[0] : data;
      if (!resultado || typeof resultado.acertou !== 'boolean') {
        feedback('A correção retornou um resultado inesperado.');
        $('btn-responder').disabled = false;
        mensagem('');
        return;
      }
      respostaEnviada = true;
      const acertou = resultado.acertou;
      const gabarito = resultado.resposta_correta;
      feedback(acertou
        ? `Correto! A alternativa ${gabarito} é a resposta oficial.`
        : `Incorreto. Você marcou ${selecionada.value}; a resposta oficial é ${gabarito}.`,
        acertou ? 'correct' : 'incorrect');
      document.querySelectorAll('input[name="resposta"]').forEach(input => input.disabled = true);
      mensagem('Resposta registrada no seu histórico.');
    });

    $('sair').addEventListener('click', async () => {
      $('sair').disabled = true;
      const { error } = await db.auth.signOut();
      $('sair').disabled = false;
      if (error) { console.error(error); mensagem('Não foi possível sair. Tente novamente.'); return; }
      mostrarLogin();
      mensagem('Você saiu da sua conta.');
    });

    async function iniciar() {
      mensagem('Verificando sessão...');
      const { data, error } = await db.auth.getSession();
      if (error) console.error('Erro de sessão:', error);
      if (data?.session) await carregarQuestao();
      else { mostrarLogin(); mensagem(''); }
    }
    iniciar();
  </script>
</body>
</html>
